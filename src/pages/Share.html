<!DOCTYPE html>
<html class="" lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сертификат BIRCH</title>
  <link href="../../src/output.css" rel="stylesheet">
  <style>
    /* Фон страницы чёрный, чтобы при деплое было ровно как в макете */
    body { background: #000000; color: #fff; font-family: Inter, system-ui, -apple-system, 'PP Neue Montreal', sans-serif; position:relative; overflow-x:hidden }
    /* Уже более узкий контейнер как в макете */
  .container { margin: 48px auto; padding: 28px; background: transparent; border-radius: 12px; position:relative; z-index:3; overflow:hidden }
    /* Растягиваем контейнер по высоте экрана аккуратно */
    .container { min-height: calc(100vh - 96px); display:flex; flex-direction:column; }
    .header { display:flex; justify-content:space-between; align-items:center }
    .title { font-size: 28px; font-weight:300; color: rgba(255,255,255,0.9) }
    .big { font-size: 48px; font-weight:300; line-height:1; }
    .muted { color: #BFBFBF }

    /* Информационные блоки — вертикальные, высокий padding и тонкая граница снизу */
    .info-block { width:100%; padding: 28px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); display:block; }
  .info-title { color: #BFBFBF; font-size: 16px; margin-bottom: 12px; display:block; line-height:1.2; white-space: normal; word-spacing: 0.22em; letter-spacing: 0.01em; overflow-wrap: anywhere; font-variant-ligatures: none; -webkit-font-feature-settings: "liga" 0; font-feature-settings: "liga" 0; }
  .info-value { font-size: 40px; font-weight:300; color: #E8FFF5; margin-top: 6px; line-height:1.08; white-space: normal; word-spacing: 0.08em; letter-spacing: 0.01em; overflow-wrap: anywhere; font-variant-ligatures: none; -webkit-font-feature-settings: "liga" 0; font-feature-settings: "liga" 0; }

    /* Ряд из двух блоков (процент и углеродный след) */
    .two-row { display:flex; gap:24px; margin-top:6px; }
    .two-row .info-block { flex:1; padding: 28px 12px; }

    /* Картинка дерева снизу */
    #giantTree { width:100%; max-height: 360px; object-fit:cover; margin-top: 18px; }

    /* Декоративные круги */
    .decor-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.95;
      pointer-events: none;
      filter: blur(200px);
    }
    .circle-bottom-leftPhone{
        display: none;
    }
    /* Круги внутри сертификата */
    .circle-top-right { width: 360px; height: 360px; right: -60px; top: -60px; background: radial-gradient(circle, #008852, #164125); }
    .circle-bottom-left { width: 360px; height: 360px; left: -60px; bottom: -60px; background: radial-gradient(circle, #008852, #164125); }

    /* Картинка дерева будет внизу и немного смещена вправо (обрезана) */
  .tree-wrap { position: absolute; right: -120px; bottom: -40px; z-index:2; pointer-events:none }
  .tree-wrap img { display:block; width:760px; max-width:none; height:auto }

    /* Адаптив */
    @media (max-width: 640px) {
      body { background: #000000 !important; } 
      .container {margin: 0; padding: 12px; }
      .big { font-size: 42px; }
      .info-value { font-size: 34px; }
      .two-row { flex-direction: column; }
      .info-block { padding: 18px 6px; }
      /* Меньше круги и меньше смещение дерева на телефоне */
      .circle-top-right, .circle-bottom-left { width: 220px; height: 220px; right: -30px; left: -30px; top: -20px; bottom: -20px }
      .tree-wrap { right: -30px; bottom: -10px }
      .tree-wrap img { width: 520px }
      #treeContainerOkay{
        margin-top: 50px !important;
      }
      .circle-bottom-leftPhone{
        display: block;
        width: 350px; 
        height: 350px; 
        left: -220px; 
        bottom: -20px; 
        filter: blur(200px);
        background: radial-gradient(circle, #008852, #164125);
      }
    }
  </style>
</head>
<body class="bg-black">
  <div class="container">

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const phone = params.get('phone');
      const type = params.get('type') || 'emission';
      const content = document.getElementById('content');

      if (!phone) {
        content.innerHTML = '<p class="muted">Параметр phone обязателен в ссылке.</p>';
        return;
      }

      const apiBaseUrl = window.VITE_API_BASE_URL || 'http://localhost:3000';
      fetch(`${apiBaseUrl}/api/users/get_by_phone.php?phone=${encodeURIComponent(phone)}`)
        .then(r=>r.json())
        .then(data=>{
          if (data.status !== 'success' || !data.data) {
            content.innerHTML = '<p class="muted">Пользователь не найден.</p>';
            return;
          }

          const u = data.data;

          // наполняем шапку
          document.getElementById('userName').textContent = u.name ? (u.name + ' ' + (u.surname || '')) : 'Пользователь';
          document.getElementById('userPhone').textContent = u.phone || '';

          const blocks = document.getElementById('blocks');
          blocks.innerHTML = '';

          function makeBlockElem(title, value) {
            const wrapper = document.createElement('div');
            wrapper.className = 'info-block';
            const t = document.createElement('div'); t.className = 'info-title'; t.textContent = title;
            const v = document.createElement('div'); v.className = 'info-value'; v.textContent = value;
            wrapper.appendChild(t);
            wrapper.appendChild(v);
            return wrapper;
          }

          // вертикальные блоки
          const totalTreesText = (typeof u.total_trees !== 'undefined' && u.total_trees !== null) ? (u.total_trees + '   🌳') : '0 🌳';
          blocks.appendChild(makeBlockElem('Я высадил ', totalTreesText));
          blocks.appendChild(makeBlockElem('Я очищаю', `${u.emission_tons !== undefined ? u.emission_tons : '?'} тонн CO₂ в год`));

          if (type === 'emission') {
            blocks.appendChild(makeBlockElem('Для полной компенсации', `~ ${u.trees_need || '?'} деревьев`));
            const invest = u.price_need ? new Intl.NumberFormat('ru-RU').format(u.price_need) + ' ₸' : (u.total_investment ? new Intl.NumberFormat('ru-RU').format(u.total_investment) + ' ₸' : '?');
            blocks.appendChild(makeBlockElem('Инвестировано в озеленение', invest));

            // пара: Восполнение эмиссии и Углеродный след в одной строке
            const two = document.createElement('div');
            two.className = 'two-row';
            two.appendChild(makeBlockElem('Восполнение эмиссии', typeof u.emission_cleared_percent !== 'undefined' ? (u.emission_cleared_percent + '%') : '?'));
            two.appendChild(makeBlockElem('Углеродный след', `${u.emission_tons !== undefined ? '~ ' + u.emission_tons + ' тонн CO₂ в год' : '?'}`));
            blocks.appendChild(two);
          }

          // подвал: подпись/промо текст уже есть в верстке
        })
        .catch(err=>{
          content.innerHTML = '<p class="muted">Ошибка при загрузке данных.</p>';
          console.error(err);
        });

    })();
  </script>

  <script>
    async function waitImages(root) {
      await Promise.all(Array.from(root.querySelectorAll('img')).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(res => { img.onload = img.onerror = res; });
      }));
    }

    async function downloadPNG() {
      const status = document.getElementById('downloadStatus');
      try {
        status.style.display = 'none';
        const cert = document.getElementById('cert');
  await waitImages(cert);
  // создаём клон сертификата для рендера с паддингом, чтобы не трогать оригинал
  const clone = cert.cloneNode(true);
  // убрать id чтобы не было дублирования в документе
  clone.id = 'cert-export-clone';
  // небольшой фикс: добавить отступ между именем и телефоном в клоне
  const clonedUserPhone = clone.querySelector('#userPhone');
  if (clonedUserPhone) clonedUserPhone.style.marginTop = '8px';
  // скрываем внутриигровые контролы в клоне
  const controls = clone.querySelector('#download-controls');
  if (controls) controls.style.display = 'none';
  // устанавливаем паддинги и фон для экспорта
  clone.style.boxSizing = 'border-box';
  clone.style.padding = '28px';
  clone.style.background = '#000';
  // подготовим клон: позиционируем вне экрана и задаём ширину/минимальную высоту до вставки
  clone.style.position = 'fixed';
  clone.style.left = '-9999px';
  clone.style.top = '0';

  clone.style.width = cert.offsetWidth + 'px';
  // minHeight — минимум из контента и высоты окна (с запасом), чтобы сертификат растягивался корректно
  clone.style.minHeight = Math.max(cert.scrollHeight, window.innerHeight - 96) + 'px';
  clone.style.boxShadow = 'none';
  // создаём wrapper — в него положим клон и клоны декоративных кружков, чтобы сохранить их в экспорте
  const wrapper = document.createElement('div');
  wrapper.id = 'cert-export-wrapper';
  wrapper.style.position = 'fixed'; wrapper.style.left = '-9999px'; wrapper.style.top = '0';
  wrapper.style.width = clone.style.width;
  wrapper.style.minHeight = clone.style.minHeight;
  wrapper.style.background = '#000';
  wrapper.style.overflow = 'hidden';
  // клонируем и добавляем декоративные кружки (они находятся в контейнере рядом с cert)
  Array.from(document.querySelectorAll('.decor-circle')).forEach(el => {
    const d = el.cloneNode(true);
    // сохранить позиционирование
    d.style.position = el.style.position || 'absolute';
    wrapper.appendChild(d);
  });
  // переставим дерево из абсолютного .tree-wrap в отдельный блок, чтобы оно не накладывался на текст
  const originalTreeWrap = clone.querySelector('.tree-wrap');
  let exportTreeBlock = null;
  if (originalTreeWrap) {
    const img = originalTreeWrap.querySelector('img');
    if (img) {
      exportTreeBlock = document.createElement('div');
      exportTreeBlock.style.width = '100%';
      exportTreeBlock.style.marginTop = '32px';
      exportTreeBlock.style.display = 'block';
      exportTreeBlock.style.textAlign = 'center';
      const exportImg = img.cloneNode(true);
      exportImg.style.width = '100%';
      exportImg.style.maxWidth = '760px';
      exportImg.style.objectFit = 'contain';
      exportImg.style.display = 'block';
      exportTreeBlock.appendChild(exportImg);
    }
    // удалим абсолютный блок из клона, он может перекрывать контент
    originalTreeWrap.remove();
  }
  wrapper.appendChild(clone);
  if (exportTreeBlock) wrapper.appendChild(exportTreeBlock);
  // Принудительно восстановим отступы между информационными блоками в клоне

  Array.from(clone.querySelectorAll('.info-title')).forEach(t => { t.style.marginBottom = t.style.marginBottom || '8px'; });
  Array.from(clone.querySelectorAll('.info-value')).forEach(v => { v.style.marginTop = v.style.marginTop || '6px'; });
  document.body.appendChild(wrapper);
  // попытка подправить размеры блока с деревом и убрать нижний паддинг у клона
  const treeContainer = clone.querySelector('#treeContainerOkay');
  if (treeContainer) {
    treeContainer.style.height = 'auto';
    treeContainer.style.overflow = 'hidden';
  }
  const giant = clone.querySelector('#giantTree');
  if (giant) { giant.style.maxHeight = 'none'; giant.style.width = '100%'; giant.style.objectFit = 'cover'; }

  const treeWrap = clone.querySelector('.tree-wrap');
  if (treeWrap) {

    treeWrap.style.bottom = '0';
    treeWrap.style.right = '0';
    treeWrap.style.marginTop = '12px';
  }
  // добавим паддинг снизу, чтобы дерево поместилось и не обрезалось
  clone.style.paddingBottom = '80px';

  try {
  const canvas = await html2canvas(wrapper, {useCORS:true, scale:2, backgroundColor: '#000'});
    // если остаётся черная полоса внизу — обрежем чисто-черные строки
    function trimCanvasBottom(srcCanvas) {
      try {
        const ctx = srcCanvas.getContext('2d');
        const w = srcCanvas.width, h = srcCanvas.height;
        const img = ctx.getImageData(0,0,w,h).data;
        const threshold = 28; // повысим чувствительность — темные градиенты тоже считаются не-пустыми
        let newH = h;
        outer: for (let y = h - 1; y >= 0; y--) {
          // проверяем каждые 2 пикселя по ширине для точности
          for (let x = 0; x < w; x += 2) {
            const i = (y * w + x) * 4;
            const r = img[i], g = img[i+1], b = img[i+2], a = img[i+3];
            // если пиксель достаточно яркий или не прозрачный — считаем, что полоса закончилась
            if (a > 20 && (r > threshold || g > threshold || b > threshold)) {
              break outer;
            }
          }
          newH = y;
        }
        if (newH < h - 2) {
          const out = document.createElement('canvas');
          out.width = w; out.height = newH;
          out.getContext('2d').drawImage(srcCanvas, 0, 0, w, newH, 0, 0, w, newH);
          return out;
        }
        return srcCanvas;
      } catch (e) {
        return srcCanvas; // если чтение данных невозможно — не трогаем
      }
    }

  const finalCanvas = trimCanvasBottom(canvas);
    const url = finalCanvas.toDataURL('image/png');
  const a = document.createElement('a'); a.href = url; a.download = 'birch_certificate.png'; document.body.appendChild(a); a.click(); a.remove();
  } finally {
    // удалить клон
  wrapper.remove();
  }
      } catch (err) {
        const status = document.getElementById('downloadStatus');
        status.style.display = 'inline';
        status.textContent = 'Ошибка при подготовке PNG: ' + (err && err.message ? err.message : 'Unknown');
      }
    }

            const pageData = pageCanvas.toDataURL('image/jpeg', 1.0);
            if (page === 0) pdf.addImage(pageData, 'JPEG', 0, 0, imgWidth, pageCanvas.height * scale2);
            else { pdf.addPage(); pdf.addImage(pageData, 'JPEG', 0, 0, imgWidth, pageCanvas.height * scale2); }
            y += pageCanvas.height; page++;
          }
        }
        pdf.save('birch_certificate.pdf');
  } finally {
    // удалить клон
    wrapper.remove();
  }
      } catch (err) {
        status.style.display = 'inline';
        status.textContent = 'Ошибка при подготовке PDF: ' + (err && err.message ? err.message : 'Unknown');
      }
    }

    document.addEventListener('DOMContentLoaded', function(){
      const png = document.getElementById('download-png');
      const pdf = document.getElementById('download-pdf');
      if (png) png.addEventListener('click', function(){ png.disabled=true; png.textContent='Готовим...'; downloadPNG().finally(()=>{ png.disabled=false; png.textContent='Скачать PNG'; }); });
      if (pdf) pdf.addEventListener('click', function(){ pdf.disabled=true; pdf.textContent='Готовим...'; downloadPDF().finally(()=>{ pdf.disabled=false; pdf.textContent='Скачать PDF'; }); });
    });
  </script>
</body>
</html>
